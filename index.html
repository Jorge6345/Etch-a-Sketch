<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./grid-logic.js" defer></script>
</head>

<body>
    <div class="left-container">

        <div class="small-container">
            <div class="text-info">Choose a Color</div>

            <div class="colors-container">
                <button class="color-box" id="blue"></button>
                <button class="color-box" id="red"></button>
                <button class="color-box" id="yellow"></button>
                <button class="color-box" id="green"></button>
                <button class="color-box" id="brown"></button>
                <button class="color-box" id="purple"></button>
                <button class="color-box" id="gray"></button>
                <button class="color-box" id="beige"></button>
                <button class="color-box" id="black"></button>
            </div>
        </div>

    </div>

    <div class="right-container">
        <div class="buttons-container">
            <button id="set-grid-amount">Grid Size</button>
            <button id="reset-button">Reset</button>
        </div>

        <div id="display-grid-size"></div>

        <div id="grid-container"></div>
    </div>
</body>
</html>
